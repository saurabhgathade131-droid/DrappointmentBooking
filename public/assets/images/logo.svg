<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&amp;family=Playfair+Display:ital,wght@0,600;0,700&amp;display=swap');
      .logo-text {
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
        font-size: 42px;
        letter-spacing: 7px;
        fill: #222220;
        text-anchor: middle;
        font-weight: 600;
      }
    </style>
    <!-- Soft Laurel Glow -->
    <radialGradient id="logoBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="85%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#EBE2D5" />
    </radialGradient>
  </defs>

  <!-- Clean Circle Background -->
  <circle cx="250" cy="250" r="235" fill="url(#logoBgGlow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#E2D7CC" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Botanical Sage Leaf Wreath Ring -->
  <g stroke="#667755" fill="#758A63" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main circular branch line -->
    <circle cx="250" cy="250" r="180" fill="none" stroke="#7A8F67" stroke-width="1.5" opacity="0.6" />

    <!-- Repeated delicate leaves around wreath -->
    <!-- Top Arc Leaves -->
    <path d="M 230 73 C 245 68 260 72 268 76 C 255 84 240 82 230 73 Z" fill="#6E845A" />
    <path d="M 268 76 C 285 75 298 84 305 92 C 290 96 278 90 268 76 Z" fill="#7F946C" />
    <path d="M 195 85 C 210 82 225 88 230 94 C 215 100 202 96 195 85 Z" fill="#6E845A" />
    
    <!-- Top Right Leaves -->
    <path d="M 335 115 C 348 122 358 135 362 145 C 348 145 338 136 335 115 Z" fill="#6E845A" />
    <path d="M 370 160 C 385 172 392 188 395 200 C 380 198 372 185 370 160 Z" fill="#7F946C" />
    <path d="M 390 215 C 405 230 408 248 408 260 C 395 255 388 240 390 215 Z" fill="#6E845A" />

    <!-- Bottom Right Leaves -->
    <path d="M 392 285 C 402 305 398 322 392 335 C 380 325 380 308 392 285 Z" fill="#7F946C" />
    <path d="M 368 348 C 372 368 362 385 352 398 C 342 384 345 368 368 348 Z" fill="#6E845A" />
    <path d="M 325 400 C 322 418 308 430 295 440 C 290 424 298 410 325 400 Z" fill="#7F946C" />

    <!-- Bottom Arc Leaves -->
    <path d="M 265 428 C 255 440 240 442 225 442 C 235 430 248 425 265 428 Z" fill="#6E845A" />
    <path d="M 215 425 C 198 432 182 430 170 422 C 185 416 200 418 215 425 Z" fill="#7F946C" />

    <!-- Bottom Left Leaves -->
    <path d="M 152 395 C 135 398 120 390 110 378 C 125 372 140 378 152 395 Z" fill="#6E845A" />
    <path d="M 115 342 C 100 338 90 322 88 308 C 102 308 112 322 115 342 Z" fill="#7F946C" />
    <path d="M 90 270 C 82 252 85 235 90 220 C 102 230 102 248 90 270 Z" fill="#6E845A" />

    <!-- Top Left Leaves -->
    <path d="M 98 195 C 95 175 105 158 115 145 C 122 160 118 178 98 195 Z" fill="#7F946C" />
    <path d="M 130 138 C 135 120 148 108 160 98 C 165 115 158 130 130 138 Z" fill="#6E845A" />
    <path d="M 165 102 C 178 88 195 80 208 75 C 205 92 195 102 165 102 Z" fill="#7F946C" />
  </g>

  <!-- Brand Typography: VEDIC (Top) -->
  <text x="250" y="190" class="logo-text">VEDIC</text>

  <!-- Mortar & Pestle (Khalva Yantra) Illustration in Center -->
  <g transform="translate(200, 215) scale(0.65)" stroke="#6C6963" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pestle (Diagonal Handle) -->
    <path d="M 105 5 L 75 52" stroke="#524E48" stroke-width="7" stroke-linecap="round" />
    <path d="M 105 5 L 112 12 L 82 58 L 75 52 Z" fill="#8C8880" stroke="#48443E" stroke-width="2" />
    <circle cx="109" cy="8" r="6" fill="#A89E92" stroke="#48443E" stroke-width="1.5" />

    <!-- Mortar Bowl Rim -->
    <ellipse cx="75" cy="55" rx="55" ry="14" fill="#F4ECE1" stroke="#48443E" stroke-width="3.5" />
    <ellipse cx="75" cy="56" rx="46" ry="10" fill="#D9CFC4" stroke="#7A746B" stroke-width="1.5" />

    <!-- Mortar Bowl Body -->
    <path d="M 22 55 C 22 105, 52 118, 75 118 C 98 118, 128 105, 128 55" fill="#E8DFD3" stroke="#48443E" stroke-width="3.5" />
    
    <!-- Shading Lines on Bowl -->
    <path d="M 38 72 C 45 95, 60 108, 75 108 C 90 108, 105 95, 112 72" stroke="#B8AFA3" stroke-width="2" stroke-dasharray="2 3" />

    <!-- Mortar Foot/Pedestal Base -->
    <path d="M 52 118 L 45 130 C 45 132, 105 132, 105 130 L 98 118 Z" fill="#D1C6B8" stroke="#48443E" stroke-width="3" />
    <ellipse cx="75" cy="130" rx="30" ry="4" fill="#36322C" opacity="0.15" />
  </g>

  <!-- Brand Typography: VAIDYA (Bottom) -->
  <text x="250" y="342" class="logo-text">VAIDYA</text>

  <!-- Subtle Ayurvedic Sanskrit Subtext / Micro Tagline -->
  <text x="250" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#B86B43" font-weight="700" text-anchor="middle">
    DR. NAGASRI TENNETI
  </text>
</svg>
